<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>To-do</h1>
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="New task" />
        <button type="submit">Add</button>
      </form>
      <nav>
        <button class="filter-button selected" type="button" data-filter="all">All</button>
        <button class="filter-button" type="button" data-filter="active">Active</button>
        <button class="filter-button" type="button" data-filter="completed">Completed</button>
      </nav>
      <ul id="todo-list"></ul>
    </main>
  </body>
</html>
